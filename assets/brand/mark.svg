<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B4CF0"/>
      <stop offset="100%" stop-color="#4A2ED6"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background; iOS applies its own corner mask, Android uses this
       as the adaptive-icon background layer / splash background. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Quest marker: a rounded map-pin silhouette with a 4-point sparkle cut
       out of its center, echoing "find the spot, complete the quest, earn
       the spark of XP" in one mark. Pin apex points down-center; overall
       shape sits within Android's adaptive-icon safe zone (roughly the
       inner 66% of the canvas) so nothing critical gets clipped by the
       system mask. -->
  <g transform="translate(512, 468)">
    <path
      d="M 0 -230
         C 127 -230 230 -127 230 0
         C 230 132 84 292 18 366
         C 8 377 -8 377 -18 366
         C -84 292 -230 132 -230 0
         C -230 -127 -127 -230 0 -230
         Z"
      fill="#FFFFFF"
    />
    <!-- 4-point sparkle, cut from the pin via a matching-fill circle punch
         is unnecessary here since the star sits on the white pin directly
         in the accent gold, reading as a badge rather than a cutout. -->
    <path
      d="M 0 -128
         C 8 -66 20 -38 40 -22
         C 20 -6 8 22 0 84
         C -8 22 -20 -6 -40 -22
         C -20 -38 -8 -66 0 -128
         Z"
      fill="#FFB800"
    />
  </g>
</svg>

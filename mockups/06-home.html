<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SideQuest — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:            #0E0E1A;
      --surface:        #FFFFFF;
      --surface-muted:  #F5F3FF;
      --primary:        #5B3DE8;
      --primary-dark:   #4A2ED6;
      --primary-light:  #EBE7FD;
      --accent:         #FFB800;
      --accent-dark:    #B45309;
      --accent-light:   #FFF8E1;
      --text-secondary: #6B6880;
      --border:         #E8E5F4;
      --success:        #2E7D32;
      --success-light:  #E8F5E9;

      --font-display: 'Syne', system-ui, sans-serif;
      --font-body:    'Inter', system-ui, sans-serif;

      --radius-card:   16px;
      --radius-btn:    14px;
      --radius-chip:   8px;
      --radius-sheet:  24px;

      --ease:            cubic-bezier(0.4, 0, 0.2, 1);
      --duration-quick:  150ms;
      --duration-screen: 350ms;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: #12082A;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 16px;
    }

    /* ── Skip link ── */
    .skip-link {
      position: absolute;
      top: -100px;
      left: 16px;
      background: var(--primary);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      z-index: 200;
      text-decoration: none;
    }
    .skip-link:focus { top: 16px; }

    /* ── Phone frame ── */
    .phone {
      width: 390px;
      min-height: 844px;
      background: #1C1532;
      border-radius: 50px;
      padding: 12px 12px 0;
      position: relative;
      box-shadow:
        0 40px 80px rgba(0, 0, 0, 0.6),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .island {
      width: 120px;
      height: 34px;
      background: #12082A;
      border-radius: 20px;
      margin: 0 auto 8px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px 8px;
      color: #fff;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
    }

    .status-icons { display: flex; gap: 5px; align-items: center; }

    /* ── Screen ── */
    .screen {
      background: var(--surface);
      border-radius: 38px 38px 0 0;
      overflow: hidden;
      height: 768px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ── App header ── */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 12px;
      flex-shrink: 0;
    }

    .app-wordmark {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.4px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ink);
      transition:
        background var(--duration-quick) var(--ease),
        border-color var(--duration-quick) var(--ease),
        transform var(--duration-quick) var(--ease);
    }
    .btn-icon:hover         { background: var(--surface-muted); border-color: var(--primary); }
    .btn-icon:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    .btn-icon:active        { transform: scale(0.92); }

    /* ── Scroll area ── */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    /* ── XP level bar ── */
    .level-card {
      background: linear-gradient(135deg, #3B1FA8 0%, var(--primary) 100%);
      border-radius: var(--radius-card);
      padding: 16px;
      color: #fff;
    }

    .level-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .level-label {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.65);
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .level-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.2px;
    }

    .xp-badge {
      background: var(--accent);
      color: var(--ink);
      padding: 4px 10px;
      border-radius: 20px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 700;
    }

    .xp-progress-track {
      height: 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .xp-progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      width: 62%;
      transition: width 0.8s var(--ease);
    }

    .xp-progress-label {
      font-family: var(--font-body);
      font-size: 12px;
      color: rgba(255,255,255,0.6);
    }

    /* ── Streak bar ── */
    .streak-card {
      background: var(--accent-light);
      border: 1.5px solid rgba(255,184,0,0.3);
      border-radius: var(--radius-card);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .streak-icon {
      font-size: 32px;
      flex-shrink: 0;
      line-height: 1;
    }

    .streak-info { flex: 1; }

    .streak-value {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
      color: var(--accent-dark);
      line-height: 1;
      margin-bottom: 3px;
    }

    .streak-label {
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* ── Daily mission card ── */
    .section-label {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 10px;
    }

    .daily-card {
      border: 1.5px solid var(--border);
      border-radius: var(--radius-card);
      overflow: hidden;
      position: relative;
    }

    .daily-card-inner {
      padding: 16px 16px 16px 20px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--surface);
      border: none;
      width: 100%;
      text-align: left;
      transition:
        background var(--duration-quick) var(--ease),
        border-color var(--duration-quick) var(--ease);
    }
    .daily-card:hover .daily-card-inner { background: var(--surface-muted); }
    .daily-card:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
    .daily-card-inner:focus-visible { outline: none; }

    .daily-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--accent);
    }

    .daily-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .daily-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      background: var(--accent-light);
      color: var(--accent-dark);
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .daily-xp {
      background: var(--accent);
      color: var(--ink);
      padding: 3px 8px;
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 700;
    }

    .daily-title {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.2;
      letter-spacing: -0.2px;
    }

    .daily-desc {
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .daily-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* ── Section with heading ── */
    .section-block {}

    /* ── Challenges (empty state) ── */
    .empty-state {
      border: 1.5px dashed var(--border);
      border-radius: var(--radius-card);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .empty-icon {
      font-size: 28px;
      line-height: 1;
    }

    .empty-title {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
    }

    .empty-sub {
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* ── Saved packs ── */
    .pack-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .pack-list::-webkit-scrollbar { display: none; }

    .pack-card {
      min-width: 130px;
      border-radius: var(--radius-card);
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
      border: none;
      padding: 0;
      background: none;
      text-align: left;
      transition: transform var(--duration-quick) var(--ease);
    }
    .pack-card:hover  { transform: translateY(-2px); }
    .pack-card:active { transform: scale(0.96); }
    .pack-card:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: var(--radius-card); }

    .pack-thumb {
      height: 84px;
      border-radius: var(--radius-card) var(--radius-card) 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .pack-info {
      background: var(--surface-muted);
      padding: 8px 10px 10px;
      border-radius: 0 0 var(--radius-card) var(--radius-card);
      border: 1.5px solid var(--border);
      border-top: none;
    }

    .pack-name {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 2px;
      line-height: 1.3;
    }

    .pack-count {
      font-family: var(--font-body);
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* ── FAB ── */
    .fab {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: var(--primary);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      box-shadow: 0 6px 20px rgba(91,61,232,0.4);
      transition:
        background var(--duration-quick) var(--ease),
        transform var(--duration-quick) var(--ease),
        box-shadow var(--duration-quick) var(--ease);
      z-index: 5;
    }
    .fab:hover         { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 10px 28px rgba(91,61,232,0.5); }
    .fab:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
    .fab:active        { transform: scale(0.94); box-shadow: none; }

    /* ── Home bar ── */
    .home-bar {
      width: 134px;
      height: 5px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 3px;
      margin: 8px auto 10px;
    }

    @media (max-width: 420px) {
      .phone  { width: 100%; min-width: 320px; border-radius: 0; padding: 12px 0 0; }
      .screen { border-radius: 0; }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to home screen</a>

  <div class="phone" role="presentation">
    <div class="island" aria-hidden="true"></div>

    <div class="status-bar" aria-hidden="true">
      <span>9:41</span>
      <div class="status-icons">
        <svg width="15" height="11" viewBox="0 0 15 11" fill="white" aria-hidden="true">
          <rect x="0" y="8"   width="3" height="3"  rx="0.5"/>
          <rect x="4" y="5.5" width="3" height="5.5" rx="0.5"/>
          <rect x="8" y="3"   width="3" height="8"  rx="0.5"/>
          <rect x="12" y="0"  width="3" height="11" rx="0.5" opacity="0.35"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
          <path d="M8 10.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z" fill="white"/>
          <path d="M5 7.5a4.5 4.5 0 0 1 6 0" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M2.5 5a8 8 0 0 1 11 0" stroke="white" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="white" aria-hidden="true">
          <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="white" stroke-opacity="0.4" fill="none"/>
          <rect x="22"  y="4"   width="2.5" height="4" rx="1" fill="white" opacity="0.4"/>
          <rect x="2"   y="2"   width="16"  height="8" rx="1.5"/>
        </svg>
      </div>
    </div>

    <main class="screen" id="main-content">

      <!-- App header -->
      <header class="app-header">
        <h1 class="app-wordmark">SideQuest</h1>
        <div class="header-actions">
          <button class="btn-icon" id="btn-profile" aria-label="Open profile">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <circle cx="9" cy="6" r="3.5" stroke="currentColor" stroke-width="1.7"/>
              <path d="M2 16c0-3.9 3.1-7 7-7s7 3.1 7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Scrollable content -->
      <div class="scroll-area" role="feed" aria-label="Home feed">

        <!-- XP level card -->
        <section aria-label="Your level and XP">
          <div class="level-card">
            <div class="level-top">
              <div>
                <div class="level-label">Level 4</div>
                <div class="level-title">Urban Explorer</div>
              </div>
              <div class="xp-badge" aria-label="620 XP">620 XP</div>
            </div>
            <div class="xp-progress-track" role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100" aria-label="62% to level 5">
              <div class="xp-progress-fill"></div>
            </div>
            <div class="xp-progress-label">380 XP to Level 5</div>
          </div>
        </section>

        <!-- Streak -->
        <section aria-label="Daily streak">
          <div class="streak-card" role="status">
            <span class="streak-icon" aria-hidden="true">🔥</span>
            <div class="streak-info">
              <div class="streak-value">3-day streak</div>
              <div class="streak-label">Complete a quest today to keep it going</div>
            </div>
          </div>
        </section>

        <!-- Daily free mission -->
        <section class="section-block" aria-labelledby="daily-heading">
          <div class="section-label" id="daily-heading">Today's free mission</div>
          <div class="daily-card">
            <button class="daily-card-inner" id="daily-mission-btn" aria-label="View quest: Street Typography">
              <div class="daily-top-row">
                <span class="daily-badge">CREATE</span>
                <span class="daily-xp">+45 XP</span>
              </div>
              <h2 class="daily-title">Street Typography</h2>
              <p class="daily-desc">Find 5 different letterforms in your environment. Collect them into one photo.</p>
              <div class="daily-meta">
                <span class="meta-pill">
                  <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                    <circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.2"/>
                    <path d="M6 3.5v3l1.5 1.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                  </svg>
                  25 min
                </span>
                <span class="meta-pill">Medium</span>
              </div>
            </button>
          </div>
        </section>

        <!-- Pending challenges (empty state) -->
        <section class="section-block" aria-labelledby="challenges-heading">
          <div class="section-label" id="challenges-heading">Pending challenges</div>
          <div class="empty-state" role="status">
            <span class="empty-icon" aria-hidden="true">🎯</span>
            <p class="empty-title">No challenges yet</p>
            <p class="empty-sub">Complete a quest and dare a friend to beat your time</p>
          </div>
        </section>

        <!-- Saved mission packs -->
        <section class="section-block" aria-labelledby="packs-heading">
          <div class="section-label" id="packs-heading">Saved mission packs</div>
          <div class="pack-list" role="list" aria-label="Saved mission packs">
            <button class="pack-card" role="listitem" aria-label="Outdoors Solo pack, 6 missions">
              <div class="pack-thumb" style="background: linear-gradient(135deg, #D1FAE5, #6EE7B7);" aria-hidden="true">🌿</div>
              <div class="pack-info">
                <div class="pack-name">Outdoors Solo</div>
                <div class="pack-count">6 missions</div>
              </div>
            </button>
            <button class="pack-card" role="listitem" aria-label="City Explorer pack, 8 missions">
              <div class="pack-thumb" style="background: linear-gradient(135deg, #EDE9FE, #C4B5FD);" aria-hidden="true">🏙️</div>
              <div class="pack-info">
                <div class="pack-name">City Explorer</div>
                <div class="pack-count">8 missions</div>
              </div>
            </button>
            <button class="pack-card" role="listitem" aria-label="Quick Wins pack, 5 missions">
              <div class="pack-thumb" style="background: linear-gradient(135deg, #FEF3C7, #FDE68A);" aria-hidden="true">⚡</div>
              <div class="pack-info">
                <div class="pack-name">Quick Wins</div>
                <div class="pack-count">5 missions</div>
              </div>
            </button>
          </div>
        </section>

        <div style="height: 72px;" aria-hidden="true"></div>
      </div>

      <!-- FAB: Start new quest -->
      <button class="fab" id="btn-new-quest" aria-label="Start a new quest">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <path d="M11 4v14M4 11h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>

    </main>

    <div class="home-bar" aria-hidden="true"></div>
  </div>

  <script>
    /* ── Daily mission tap ── */
    document.getElementById('daily-mission-btn').addEventListener('click', function () {
      window.location.href = '03-mission-detail.html';
    });

    /* ── FAB: new quest ── */
    document.getElementById('btn-new-quest').addEventListener('click', function () {
      window.location.href = '07-mode-select.html';
    });

    /* ── Profile ── */
    document.getElementById('btn-profile').addEventListener('click', function () {
      /* In production: navigate to profile */
    });

    /* ── Pack cards ── */
    document.querySelectorAll('.pack-card').forEach(function (card) {
      card.addEventListener('click', function () {
        /* In production: navigate to saved pack */
      });
    });

    /* ── Animate XP fill on load ── */
    document.addEventListener('DOMContentLoaded', function () {
      const fill = document.querySelector('.xp-progress-fill');
      if (fill) {
        fill.style.width = '0%';
        requestAnimationFrame(function () {
          setTimeout(function () { fill.style.width = '62%'; }, 300);
        });
      }
    });
  </script>
</body>
</html>

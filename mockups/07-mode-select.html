<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SideQuest — Choose Your Mode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:            #0E0E1A;
      --surface:        #FFFFFF;
      --surface-muted:  #F5F3FF;
      --primary:        #5B3DE8;
      --primary-dark:   #4A2ED6;
      --primary-light:  #EBE7FD;
      --accent:         #FFB800;
      --text-secondary: #6B6880;
      --border:         #E8E5F4;

      --font-display: 'Syne', system-ui, sans-serif;
      --font-body:    'Inter', system-ui, sans-serif;

      --radius-card:   16px;
      --radius-btn:    14px;
      --radius-chip:   8px;

      --ease:            cubic-bezier(0.4, 0, 0.2, 1);
      --duration-quick:  150ms;
      --duration-screen: 350ms;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: #12082A;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 16px;
    }

    /* ── Skip link ── */
    .skip-link {
      position: absolute;
      top: -100px;
      left: 16px;
      background: var(--primary);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      z-index: 200;
      text-decoration: none;
    }
    .skip-link:focus { top: 16px; }

    /* ── Phone frame ── */
    .phone {
      width: 390px;
      min-height: 844px;
      background: #1C1532;
      border-radius: 50px;
      padding: 12px 12px 0;
      position: relative;
      box-shadow:
        0 40px 80px rgba(0, 0, 0, 0.6),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .island {
      width: 120px;
      height: 34px;
      background: #12082A;
      border-radius: 20px;
      margin: 0 auto 8px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px 8px;
      color: #fff;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
    }

    .status-icons { display: flex; gap: 5px; align-items: center; }

    /* ── Screen ── */
    .screen {
      background: var(--surface);
      border-radius: 38px 38px 0 0;
      overflow: hidden;
      height: 768px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ── Header ── */
    .screen-header {
      padding: 20px 20px 8px;
      flex-shrink: 0;
    }

    .screen-eyebrow {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 4px;
    }

    .screen-title {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.5px;
      line-height: 1.12;
      margin-bottom: 6px;
    }

    .screen-sub {
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* ── Mode grid ── */
    .modes-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .modes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Mode card */
    .mode-card {
      border-radius: var(--radius-card);
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition:
        border-color var(--duration-quick) var(--ease),
        transform var(--duration-quick) var(--ease),
        box-shadow var(--duration-quick) var(--ease);
      background: none;
      padding: 0;
      text-align: left;
      display: flex;
      flex-direction: column;
    }
    .mode-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }
    .mode-card:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }
    .mode-card:active { transform: scale(0.96); box-shadow: none; }

    .mode-thumb {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      position: relative;
      overflow: hidden;
    }

    /* Mode-specific accent colours (tints within design system) */
    .mode-card[data-mode="solo"]       .mode-thumb { background: linear-gradient(135deg, #EBE7FD, #C4B5FD); }
    .mode-card[data-mode="couple"]     .mode-thumb { background: linear-gradient(135deg, #FCE7F3, #FCA5A5); }
    .mode-card[data-mode="friends"]    .mode-thumb { background: linear-gradient(135deg, #FEF3C7, #FDE68A); }
    .mode-card[data-mode="family"]     .mode-thumb { background: linear-gradient(135deg, #D1FAE5, #6EE7B7); }
    .mode-card[data-mode="city"]       .mode-thumb { background: linear-gradient(135deg, #DBEAFE, #93C5FD); }
    .mode-card[data-mode="confidence"] .mode-thumb { background: linear-gradient(135deg, #F0FDF4, #86EFAC); }
    .mode-card[data-mode="travel"]     .mode-thumb { background: linear-gradient(135deg, #FFF7ED, #FED7AA); }
    .mode-card[data-mode="kids"]       .mode-thumb { background: linear-gradient(135deg, #FFF1F2, #FDA4AF); }

    .mode-info {
      padding: 10px 12px 12px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-top: none;
      border-radius: 0 0 var(--radius-card) var(--radius-card);
      flex: 1;
    }

    .mode-card[data-mode="solo"]       .mode-info { border-color: #C4B5FD; }
    .mode-card[data-mode="couple"]     .mode-info { border-color: #FCA5A5; }
    .mode-card[data-mode="friends"]    .mode-info { border-color: #FDE68A; }
    .mode-card[data-mode="family"]     .mode-info { border-color: #6EE7B7; }
    .mode-card[data-mode="city"]       .mode-info { border-color: #93C5FD; }
    .mode-card[data-mode="confidence"] .mode-info { border-color: #86EFAC; }
    .mode-card[data-mode="travel"]     .mode-info { border-color: #FED7AA; }
    .mode-card[data-mode="kids"]       .mode-info { border-color: #FDA4AF; }

    .mode-name {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 3px;
      line-height: 1.3;
    }

    .mode-hint {
      font-family: var(--font-body);
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* ── Home bar ── */
    .home-bar {
      width: 134px;
      height: 5px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 3px;
      margin: 8px auto 10px;
    }

    @media (max-width: 420px) {
      .phone  { width: 100%; min-width: 320px; border-radius: 0; padding: 12px 0 0; }
      .screen { border-radius: 0; }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to mode selection</a>

  <div class="phone" role="presentation">
    <div class="island" aria-hidden="true"></div>

    <div class="status-bar" aria-hidden="true">
      <span>9:41</span>
      <div class="status-icons">
        <svg width="15" height="11" viewBox="0 0 15 11" fill="white" aria-hidden="true">
          <rect x="0" y="8"   width="3" height="3"  rx="0.5"/>
          <rect x="4" y="5.5" width="3" height="5.5" rx="0.5"/>
          <rect x="8" y="3"   width="3" height="8"  rx="0.5"/>
          <rect x="12" y="0"  width="3" height="11" rx="0.5" opacity="0.35"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
          <path d="M8 10.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z" fill="white"/>
          <path d="M5 7.5a4.5 4.5 0 0 1 6 0" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M2.5 5a8 8 0 0 1 11 0" stroke="white" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="white" aria-hidden="true">
          <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="white" stroke-opacity="0.4" fill="none"/>
          <rect x="22"  y="4"   width="2.5" height="4" rx="1" fill="white" opacity="0.4"/>
          <rect x="2"   y="2"   width="16"  height="8" rx="1.5"/>
        </svg>
      </div>
    </div>

    <main class="screen" id="main-content">

      <!-- Header -->
      <header class="screen-header">
        <p class="screen-eyebrow">Choose a mode</p>
        <h1 class="screen-title">What kind of quest?</h1>
        <p class="screen-sub">Your pick filters the experience from the start</p>
      </header>

      <!-- Mode grid -->
      <div class="modes-scroll">
        <div class="modes-grid" role="list" aria-label="Quest modes">

          <button class="mode-card" data-mode="solo" role="listitem"
                  aria-label="Solo Adventure: independent quests for one">
            <div class="mode-thumb" aria-hidden="true">🧍</div>
            <div class="mode-info">
              <div class="mode-name">Solo Adventure</div>
              <div class="mode-hint">Independent quests</div>
            </div>
          </button>

          <button class="mode-card" data-mode="couple" role="listitem"
                  aria-label="Couple Mode: quests designed for two">
            <div class="mode-thumb" aria-hidden="true">💑</div>
            <div class="mode-info">
              <div class="mode-name">Couple Mode</div>
              <div class="mode-hint">Designed for two</div>
            </div>
          </button>

          <button class="mode-card" data-mode="friends" role="listitem"
                  aria-label="Friends Night: social group missions">
            <div class="mode-thumb" aria-hidden="true">👥</div>
            <div class="mode-info">
              <div class="mode-name">Friends Night</div>
              <div class="mode-hint">Social group missions</div>
            </div>
          </button>

          <button class="mode-card" data-mode="family" role="listitem"
                  aria-label="Family Weekend: fun for all ages">
            <div class="mode-thumb" aria-hidden="true">👨‍👩‍👧</div>
            <div class="mode-info">
              <div class="mode-name">Family Weekend</div>
              <div class="mode-hint">Fun for all ages</div>
            </div>
          </button>

          <button class="mode-card" data-mode="city" role="listitem"
                  aria-label="Explore My City: discover your neighbourhood">
            <div class="mode-thumb" aria-hidden="true">🏙️</div>
            <div class="mode-info">
              <div class="mode-name">Explore My City</div>
              <div class="mode-hint">Know your neighbourhood</div>
            </div>
          </button>

          <button class="mode-card" data-mode="confidence" role="listitem"
                  aria-label="Confidence Builder: step outside your comfort zone">
            <div class="mode-thumb" aria-hidden="true">💪</div>
            <div class="mode-info">
              <div class="mode-name">Confidence Builder</div>
              <div class="mode-hint">Push your comfort zone</div>
            </div>
          </button>

          <button class="mode-card" data-mode="travel" role="listitem"
                  aria-label="Travel Mode: quests for unfamiliar places">
            <div class="mode-thumb" aria-hidden="true">✈️</div>
            <div class="mode-info">
              <div class="mode-name">Travel Mode</div>
              <div class="mode-hint">For unfamiliar places</div>
            </div>
          </button>

          <button class="mode-card" data-mode="kids" role="listitem"
                  aria-label="Kids Mode: child-safe adventures">
            <div class="mode-thumb" aria-hidden="true">🧸</div>
            <div class="mode-info">
              <div class="mode-name">Kids Mode</div>
              <div class="mode-hint">Child-safe adventures</div>
            </div>
          </button>

        </div>
      </div>

    </main>

    <div class="home-bar" aria-hidden="true"></div>
  </div>

  <script>
    /* ── Mode card tap feedback ── */
    document.querySelectorAll('.mode-card').forEach(function (card) {
      card.addEventListener('click', function () {
        const modeName = this.getAttribute('data-mode');
        /* Visual tap feedback */
        this.style.borderColor = 'var(--primary)';
        this.style.boxShadow   = '0 0 0 3px var(--primary-light)';
        setTimeout(() => {
          this.style.borderColor = '';
          this.style.boxShadow   = '';
          window.location.href = '01-onboarding.html';
        }, 300);
      });

      /* Keyboard: Enter / Space select */
      card.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          this.click();
        }
      });
    });
  </script>
</body>
</html>
